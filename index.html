<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فريق الإعلام | الصفحة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-dark: #070e17; 
            --secondary-dark: #121f30; 
            --gold: #d4af37; 
            --gold-light: #f3d573;
            --light-blue: #00e1ff; 
            --text-light: #e0e0e0; 
            --white: #ffffff; 
            --discord-color: #5865F2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--primary-dark); color: var(--text-light); min-height: 100vh; padding-top: 90px; }

        /* Header Navigation */
        header { background-color: rgba(7, 14, 23, 0.95); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(10px); }
        .logo h1 { color: var(--gold); font-size: 22px; font-weight: 800; }
        .logo span { font-size: 11px; color: var(--text-light); display: block; }
        
        nav ul { display: flex; list-style: none; gap: 20px; align-items: center; }
        nav a { color: var(--text-light); text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--gold); }
        
        /* Status Badge */
        .status-badge { background: rgba(0, 225, 255, 0.1); border: 1px solid var(--light-blue); color: var(--light-blue); padding: 4px 10px; border-radius: 12px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
        .pulse-dot { width: 6px; height: 6px; background-color: var(--light-blue); border-radius: 50%; box-shadow: 0 0 8px var(--light-blue); }

        /* Buttons & Auth */
        .btn-gold { background: linear-gradient(to left, #b48e28, #d4af37); color: var(--primary-dark) !important; padding: 8px 18px; border-radius: 6px; font-weight: 800 !important; }
        .btn-discord { background-color: var(--discord-color); color: var(--white); padding: 8px 16px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: 0.3s; }
        .btn-discord:hover { background-color: #4752C4; transform: translateY(-2px); }

        .user-profile { display: none; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--gold); }
        .user-name { font-size: 13px; font-weight: 700; color: var(--white); }
        .btn-logout { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 14px; margin-right: 5px; }

        /* Hero Section */
        .hero { text-align: center; padding: 100px 20px 60px; max-width: 900px; margin: 0 auto; }
        .hero h2 { font-size: 40px; color: var(--white); font-weight: 800; margin-bottom: 15px; }
        .hero h2 span { color: var(--gold); }
        .hero p { font-size: 18px; line-height: 1.8; opacity: 0.9; margin-bottom: 30px; }
        .welcome-box { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); padding: 12px 20px; border-radius: 8px; color: var(--gold-light); display: inline-block; font-weight: 700; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header>
        <div class="logo">
            <h1>PMT SYSTEM</h1>
            <span>نظام إدارة فريق الإعلام الموحد</span>
        </div>
        <nav>
            <ul>
                <li><span class="status-badge"><span class="pulse-dot"></span> النظام متصل</span></li>
                <li><a href="index.html" class="active">الصفحة الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="tasks.html">مهام الفريق</a></li>
                <li><a href="apply.html" class="btn-gold">التقديم</a></li>
                
                <!-- تبويب لوحة الإدارة (يظهر تلقائياً للمالك والآدمن فقط) -->
                <li><a href="admin.html" id="admin-tab" style="display: none; color: #00e1ff;"><i class="fa-solid fa-shield-halved"></i> لوحة الإدارة</a></li>

                <!-- منطقة تسجيل الدخول -->
                <li id="auth-container">
                    <button id="login-btn" class="btn-discord" onclick="loginWithDiscord()">
                        <i class="fa-brands fa-discord"></i> دخول عبر ديسكورد
                    </button>
                    <div id="user-profile" class="user-profile">
                        <img id="user-avatar" class="user-avatar" src="" alt="Avatar">
                        <span id="user-name" class="user-name"></span>
                        <button class="btn-logout" onclick="logout()" title="تسجيل الخروج"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Hero Content Section -->
    <section class="hero">
        <div id="welcome-msg" class="welcome-box">أهلاً بك في البوابة الرسمية لفريق الإعلام</div>
        <h2>المنصة الإعلامية <span>الموحدة</span></h2>
        <p>نعمل على تغطية وإدارة كافة الفعاليات والأخبار الرسمية بأعلى مستويات الاحترافية والسرعة.</p>
    </section>

    <script>
        // إعدادات الديسكورد والمالك
        const CLIENT_ID = '123456789012345678'; // استبدله بـ Client ID الخاص بتطبيقك في ديسكورد
        const REDIRECT_URI = encodeURIComponent(window.location.origin + window.location.pathname);
        
        // قائمة الإدارة والمالك (تعتمد اسم المستخدم والـ ID)
        const ADMIN_USERS = ['yx8q']; 
        const ADMIN_IDS = ['1536788735335604344']; 

        function loginWithDiscord() {
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=identify`;
        }

        function logout() {
            localStorage.removeItem('discord_user');
            window.location.href = window.location.pathname;
        }

        function fetchUserData(token) {
            fetch('https://discord.com/api/users/@me', {
                headers: { authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(response => {
                const { username, avatar, id } = response;
                if (username) {
                    const userData = {
                        id: id,
                        name: username,
                        avatarUrl: avatar ? `https://cdn.discordapp.com/avatars/${id}/${avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png'
                    };
                    localStorage.setItem('discord_user', JSON.stringify(userData));
                    showUserProfile(userData);
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            })
            .catch(console.error);
        }

        function showUserProfile(user) {
            document.getElementById('login-btn').style.display = 'none';
            const profileDiv = document.getElementById('user-profile');
            profileDiv.style.display = 'flex';
            document.getElementById('user-avatar').src = user.avatarUrl;
            document.getElementById('user-name').innerText = user.name;
            
            const welcomeElem = document.getElementById('welcome-msg');
            if (welcomeElem) {
                welcomeElem.innerText = `أهلاً بك يا ${user.name} في نظام فريق الإعلام الموحد!`;
            }

            // التحقق من صلاحية الإدارة لإظهار التبويب للمالك yx8q
            const adminTab = document.getElementById('admin-tab');
            if (adminTab) {
                if (ADMIN_USERS.includes(user.name.toLowerCase()) || ADMIN_IDS.includes(user.id)) {
                    adminTab.style.display = 'inline-block';
                }
            }
        }

        // فحص حالة الجلسة أو توكن الديسكورد عند تحميل الصفحة
        window.onload = function() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                fetchUserData(accessToken);
            } else {
                const savedUser = localStorage.getItem('discord_user');
                if (savedUser) {
                    showUserProfile(JSON.parse(savedUser));
                }
            }
        };
    </script>
</body>
</html>
