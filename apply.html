<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMT | لوحة الإدارة والتحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg-main: #030712; 
            --bg-card: rgba(17, 24, 39, 0.8); 
            --border-color: rgba(0, 240, 255, 0.3);
            --gold: #f3d573; 
            --cyan: #00f0ff; 
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --text-main: #f3f4f6; 
            --text-sub: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; }
        
        body { 
            background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 10%, rgba(0, 240, 255, 0.1) 0%, transparent 60%);
        }

        header {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 1280px;
            background: rgba(10, 15, 26, 0.85); backdrop-filter: blur(16px);
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .brand-logo { display: flex; align-items: center; gap: 12px; }
        .brand-logo i { font-size: 24px; color: var(--cyan); }
        .brand-logo .title { font-weight: 900; font-size: 20px; color: #fff; }

        .admin-badge { background: rgba(0, 240, 255, 0.15); border: 1px solid var(--cyan); color: var(--cyan); padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: 800; }

        .page-container { padding-top: 140px; padding-bottom: 80px; max-width: 1200px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
        
        /* Stats Bar */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 20px; text-align: center; }
        .stat-card h4 { color: var(--text-sub); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        .stat-card .num { font-size: 32px; font-weight: 900; color: var(--cyan); }

        /* Control Panel Grid */
        .admin-section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px; margin-bottom: 30px; }
        .admin-section h2 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .admin-section h2 i { color: var(--gold); }

        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 14px; }
        th { color: var(--gold); font-weight: 800; }
        td { color: var(--text-main); }

        .btn-action { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 5px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-action:hover { background: var(--cyan); color: #000; }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <i class="fa-solid fa-shield-halved"></i>
            <div>
                <span class="title">PMT ADMIN PANEL</span>
            </div>
        </div>
        <div class="admin-badge"><i class="fa-solid fa-user-check"></i> المالك: yx8q</div>
        <a href="index.html" style="color: var(--gold); text-decoration: none; font-weight: 700; font-size: 13px;"><i class="fa-solid fa-arrow-right"></i> العودة للموقع</a>
    </header>

    <div class="page-container">
        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>إجمالي الطلبات</h4>
                <div class="num">12</div>
            </div>
            <div class="stat-card">
                <h4>أعضاء الفريق النشطين</h4>
                <div class="num">8</div>
            </div>
            <div class="stat-card">
                <h4>المهام المنجزة</h4>
                <div class="num">45</div>
            </div>
            <div class="stat-card">
                <h4>حالة السيرفر</h4>
                <div class="num" style="color: #00ff88;">متصل</div>
            </div>
        </div>

        <!-- Section: Application Requests -->
        <div class="admin-section">
            <h2><i class="fa-solid fa-file-signature"></i> طلبت التقديم المعلقة</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم المستخدم</th>
                        <th>التخصص المطلوب</th>
                        <th>الحالة</th>
                        <th>التحكم</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Oscar_Marcus</td>
                        <td>مصور ميداني</td>
                        <td><span style="color: var(--gold);">قيد المراجعة</span></td>
                        <td><button class="btn-action">قبول الطلب</button></td>
                    </tr>
                    <tr>
                        <td>Gamer_123</td>
                        <td>مصمم / مونتير</td>
                        <td><span style="color: var(--gold);">قيد المراجعة</span></td>
                        <td><button class="btn-action">قبول الطلب</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_USERS = ['yx8q'];

        // حماية الصفحة ومنع الزوار العاديين تلقائياً
        (function protectAdminPage() {
            const saved = localStorage.getItem('discord_user');
            if (!saved) {
                alert("عذراً، يجب تسجيل الدخول بالحساب المصرح له أولاً!");
                window.location.href = "index.html";
                return;
            }

            const user = JSON.parse(saved);
            if (!ADMIN_USERS.includes(user.name.toLowerCase())) {
                alert("وصول مرفوض! هذه الصفحة مخصصة للمالك والإدارة فقط.");
                window.location.href = "index.html";
            }
        })();
    </script>
</body>
</html>
