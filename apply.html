<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فريق الإعلام | التقديم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-dark: #070e17; --secondary-dark: #121f30; --gold: #d4af37; --text-light: #e0e0e0; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--primary-dark); color: var(--text-light); }
        header { background-color: rgba(7, 14, 23, 0.95); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; top: 0; border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        .logo h1 { color: var(--gold); font-size: 24px; font-weight: 800; }
        .logo span { font-size: 12px; color: var(--text-light); display: block; }
        nav ul { list-style: none; display: flex; gap: 30px; align-items: center; }
        nav ul li a { text-decoration: none; color: var(--white); font-weight: 600; font-size: 15px; }
        nav ul li a:hover, nav ul li a.active { color: var(--gold); }
        .btn-gold { background: linear-gradient(to left, #b48e28, #d4af37); color: var(--primary-dark); padding: 8px 22px; border-radius: 4px; font-weight: 800; text-decoration: none; }
        .page-content { min-height: 100vh; padding: 130px 20px 50px; display: flex; flex-direction: column; align-items: center; }
        .form-box { width: 100%; max-width: 600px; background: var(--secondary-dark); padding: 30px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.2); margin-top: 20px; }
        .form-box h2 { color: var(--gold); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--white); font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: var(--primary-dark); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 4px; color: #fff; font-size: 14px; }
        .submit-btn { width: 100%; padding: 12px; background: var(--gold); color: var(--primary-dark); font-weight: 800; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .submit-btn:hover { background: #f3d573; }
        footer { background-color: #04080d; padding: 20px 50px; text-align: center; font-size: 13px; width: 100%; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><h1>PMT</h1><span>فريق الإعلام | LSPD</span></div>
        <nav>
            <ul>
                <li><a href="index.html">الصفحة الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="tasks.html">مهام الفريق</a></li>
                <li><a href="apply.html" class="btn-gold active">التقديم</a></li>
            </ul>
        </nav>
    </header>
    <div class="page-content">
        <div class="form-box">
            <h2>استمارة التقديم للفريق</h2>
            <form onsubmit="event.preventDefault(); alert('تم إرسال الطلب بنجاح!');">
                <div class="form-group">
                    <label>الاسم الكامل (Character Name):</label>
                    <input type="text" placeholder="أدخل اسم الشخصية" required>
                </div>
                <div class="form-group">
                    <label>معرف  الديسكورد (Discord Tag):</label>
                    <input type="text" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <label>التخصص / الخبرة (مونتاج، تصوير، تمثيل...):</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>نبذة عن سبب رغبتك بالانضمام:</label>
                    <textarea rows="4" required></textarea>
                </div>
                <button type="submit" class="submit-btn">إرسال الطلب</button>
            </form>
        </div>
    </div>
    <footer><p>&copy; 2026 جميع الحقوق محفوظة لـ فريق الإعلام - PMT.</p></footer>
</body>
</html>
